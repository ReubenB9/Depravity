    Properties:
      CodeUri: backend/
      Handler: src/handlers/main/users/post-user-item.mainPostUserItemHandler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 100
      Description: A simple example includes a HTTP post method to add one item to a
        DynamoDB table.
      Environment:
        Variables:
          # Make DynamoDB endpoint accessible as environment variable from function code during execution
          MAINTABLE_TABLE_NAME: !Ref mainTable
          MAINTABLE_TABLE_ARN: !GetAtt mainTable.Arn
      Policies:
        # Give Create/Read/Update/Delete Permissions to the SampleTable
        - DynamoDBCrudPolicy:
            TableName: !Ref mainTable
