AWSTemplateFormatVersion: 2010-09-09
Description: Depravity_Template
Transform: AWS::Serverless-2016-10-31

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is an API gateway associated with the getByIdFunction and putItemFunctions

  # This is a Lambda function config associated with the source code: get-by-id.js

  mainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  GeoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: Hash
          AttributeType: S
        - AttributeName: Range
          AttributeType: 'N'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Hash
          KeyType: HASH
        - AttributeName: Range
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  geoPutItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: geoPutItemFunction
      CodeUri: backend/
      Handler: src/handlers/geo-put-item.geoPutItemHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          GEOTABLE_TABLE_NAME: !Ref GeoTable
          GEOTABLE_TABLE_ARN: !GetAtt GeoTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GeoTable
      Events:
        ApiGatewayApiPOSTgeo:
          Type: Api
          Properties:
            Path: /geo
            Method: POST
            RestApiId: !Ref ApiGatewayApi
  geoPutItemFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${geoPutItemFunction}
  geoGetItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: geoGetItemsFunction
      CodeUri: backend/
      Handler: src/handlers/geo-query-rectangle.geoGetQueryHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          GEOTABLE_TABLE_NAME: !Ref GeoTable
          GEOTABLE_TABLE_ARN: !GetAtt GeoTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GeoTable
      Events:
        ApiGatewayApiGETgeo:
          Type: Api
          Properties:
            Path: /geo
            Method: GET
            RestApiId: !Ref ApiGatewayApi
  geoGetItemsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${geoGetItemsFunction}
  geoDeleteItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: geoDeleteItemFunction
      CodeUri: backend/
      Handler: src/handlers/geo-delete-item.geoDeleteItemHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          GEOTABLE_TABLE_NAME: !Ref GeoTable
          GEOTABLE_TABLE_ARN: !GetAtt GeoTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GeoTable
      Events:
        ApiGatewayApiDELETEgeo:
          Type: Api
          Properties:
            Path: /geo
            Method: DELETE
            RestApiId: !Ref ApiGatewayApi
  geoDeleteItemFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${geoDeleteItemFunction}
  DepravityUsers:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AliasAttributes:
        - email
        - preferred_username
      UserPoolName: !Sub ${AWS::StackName}-DepravityUsers
  geoUpdateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: geoUpdateItemFunction
      CodeUri: backend/
      Handler: src/handlers/geo-update-item.geoUpdateItemHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          GEOTABLE_TABLE_NAME: !Ref GeoTable
          GEOTABLE_TABLE_ARN: !GetAtt GeoTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GeoTable
      Events:
        ApiGatewayApiPUTgeo:
          Type: Api
          Properties:
            Path: /geo
            Method: PUT
            RestApiId: !Ref ApiGatewayApi
  geoUpdateItemFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${geoUpdateItemFunction}
  ApiCognitoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: ApiCognitoApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /signup:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginSignUpUserFunction.Arn}/invocations
              responses: {}
          /confirm-signup:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginConfirmSignUpFunction.Arn}/invocations
              responses: {}
          /forgot-password:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginForgotPasswordFunction.Arn}/invocations
              responses: {}
          /confirm-forgot-password:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginConfirmForgotPasswordFunction.Arn}/invocations
              responses: {}
          /login:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginLoginFunction.Arn}/invocations
              responses: {}
          /resend-confirmation-code:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginResendConfirmationCodeFunction.Arn}/invocations
              responses: {}
          /add-user-permissions:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginAddUserPermissionsFunction.Arn}/invocations
              responses: {}
          /generate-certificate:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginGenerateCertificateFunction.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        MaxAge: 5
        AllowMethods: '''GET, POST'''
  loginSignUpUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: loginSignUpUserFunction
      CodeUri: backend/
      Handler: src/handlers/login/sign-up-user.signUpUserHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          DEPRAVITYUSERS_USER_POOL_ID: !Ref DepravityUsers
          DEPRAVITYUSERS_USER_POOL_ARN: !GetAtt DepravityUsers.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:Admin*
                - cognito-idp:DescribeIdentityProvider
                - cognito-idp:DescribeResourceServer
                - cognito-idp:DescribeUserPool
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:DescribeUserPoolDomain
                - cognito-idp:GetGroup
                - cognito-idp:ListGroups
                - cognito-idp:ListUserPoolClients
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:UpdateGroup
              Resource: !GetAtt DepravityUsers.Arn
      Events:
        ApiCognitoApiPOSTsignup:
          Type: Api
          Properties:
            Path: /signup
            Method: POST
            RestApiId: !Ref ApiCognitoApi
  loginSignUpUserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${loginSignUpUserFunction}
  loginConfirmSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: loginConfirmSignUpFunction
      CodeUri: backend/
      Handler: src/handlers/login/confirm-sign-up.confirmSignUpHandler
      Runtime: python3.13
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          DEPRAVITYUSERS_USER_POOL_ID: !Ref DepravityUsers
          DEPRAVITYUSERS_USER_POOL_ARN: !GetAtt DepravityUsers.Arn
          DEPRAVITYUSERS_USER_POOL_ID_2: !Ref DepravityUsers
          DEPRAVITYUSERS_USER_POOL_ARN_2: !GetAtt DepravityUsers.Arn
      Events:
        ApiCognitoApiPOSTconfirmsignup:
          Type: Api
          Properties:
            Path: /confirm-signup
            Method: POST
            RestApiId: !Ref ApiCognitoApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:Admin*
                - cognito-idp:DescribeIdentityProvider
                - cognito-idp:DescribeResourceServer
                - cognito-idp:DescribeUserPool
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:DescribeUserPoolDomain
                - cognito-idp:GetGroup
                - cognito-idp:ListGroups
                - cognito-idp:ListUserPoolClients
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:UpdateGroup
              Resource: !GetAtt DepravityUsers.Arn
        - LambdaInvokePolicy:
            FunctionName: !Ref loginAddUserPermissionsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref loginGenerateCertificateFunction
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:Admin*
                - cognito-idp:DescribeIdentityProvider
                - cognito-idp:DescribeResourceServer
                - cognito-idp:DescribeUserPool
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:DescribeUserPoolDomain
                - cognito-idp:GetGroup
                - cognito-idp:ListGroups
                - cognito-idp:ListUserPoolClients
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:UpdateGroup
              Resource: !GetAtt DepravityUsers.Arn
        - LambdaInvokePolicy:
            FunctionName: !Ref loginAddUserPermissionsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref loginGenerateCertificateFunction
  loginConfirmSignUpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${loginConfirmSignUpFunction}
  loginForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: loginForgotPasswordFunction
